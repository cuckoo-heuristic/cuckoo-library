[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cuckoo-library"
version = "1.0.0"
description = "A library that provides operations for metaheuristic algorithms"
readme = "README.md"
requires-python = ">=3.10"

license = { text = "MIT" }

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]


[tool.setuptools.packages.find]
where = ["."]
include = ["cuckoo_library*"]

[project.urls]
Homepage = "https://github.com/cuckoo-heuristic/cuckoo-library"
Source = "https://github.com/cuckoo-heuristic/cuckoo-library"
